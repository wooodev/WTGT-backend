spring:
  application:
    name: catsgotogedog
  config:
    import: optional:classpath:application-secret.properties
  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: false

  flyway:
    enabled: true
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    baseline-on-migrate: true
    locations: classpath:db/migration/mysql
    fail-on-missing-locations: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname,profile_image,account_email
            client-authentication-method: client_secret_post
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: name,email,profile_image
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  cloud:
    aws:
      credentials:
        access-key: ${NCP_ACCESS_KEY}
        secret-key: ${NCP_SECRET_KEY}
      s3:
        endpoint: https://kr.object.ncloudstorage.com
        bucket: catsgotogedogbucket
      region:
        static: kr-standard

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
      table-prefix: BATCH_

server:
  forward-headers-strategy: framework

frontend:
  base:
    url: ${FRONTEND_BASE_URL}

allowed:
  origins:
    url: ${ALLOWED_ORIGINS_URL}
  http:
    methods: GET,POST,PUT,PATCH,DELETE,HEAD,OPTIONS

jwt:
  secret: ${JWT_SECRET}
  access-expire-min: 30
  refresh-expire-day: 90

clova:
  api:
    url: https://clovastudio.stream.ntruss.com/v3/chat-completions/HCX-005
    key: ${CLOVA_API_KEY}
    request-id: ${CLOVA_REQUEST_ID}
    embed:
      url: ${CLOVA_EMBED_URL}

google:
  perspective:
    api:
      url: https://commentanalyzer.googleapis.com/v1alpha1/comments:analyze
      key: ${PERSPECTIVE_API_KEY}

tour:
  api:
    base-url: https://apis.data.go.kr/B551011/KorPetTourService
    service-key: ${TOUR_API_SERVICE_KEY}

openai:
  api:
    chat-url: https://api.openai.com/v1/chat/completions
    key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL}